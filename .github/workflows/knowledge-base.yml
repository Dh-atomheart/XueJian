name: Knowledge Base Validation

on:
  push:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/docs/**'
      - '.github/workflows/knowledge-base.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/docs/**'
      - '.github/workflows/knowledge-base.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docs
        run: python scripts/docs/validate.py

      - name: Validate architecture boundaries
        run: python scripts/docs/check_architecture.py

      - name: Check generated DB schema
        run: python scripts/docs/generate_db_schema.py --check
