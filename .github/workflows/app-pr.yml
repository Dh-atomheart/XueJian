name: App PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      app: ${{ steps.filter.outputs.app }}
      desktop: ${{ steps.filter.outputs.desktop }}
      python: ${{ steps.filter.outputs.python }}
      docs_only: ${{ steps.flags.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'README.md'
              - 'scripts/docs/**'
              - '.github/workflows/knowledge-base.yml'
              - '.github/workflows/doc-garden.yml'
            app:
              - 'xuejian/**'
              - 'scripts/ci/**'
              - '.github/workflows/app-*.yml'
              - '.github/workflows/release-windows.yml'
            desktop:
              - 'xuejian/src-tauri/**'
              - 'xuejian/Cargo.lock'
            python:
              - 'xuejian/orchestration_service/**'
              - 'xuejian/tests/unit/**'
              - 'scripts/ci/python_orchestration_smoke.py'

      - name: Compute flags
        id: flags
        run: |
          if [[ "${{ steps.filter.outputs.docs }}" == 'true' && "${{ steps.filter.outputs.app }}" != 'true' && "${{ steps.filter.outputs.desktop }}" != 'true' && "${{ steps.filter.outputs.python }}" != 'true' ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  docs-validate:
    name: docs-validate
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs == 'true' || needs.detect-changes.outputs.docs_only == 'true' || needs.detect-changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xuejian/package-lock.json

      - name: Install app dependencies
        working-directory: xuejian
        run: npm ci

      - name: Validate docs
        run: python scripts/docs/validate.py

      - name: Validate architecture boundaries
        run: python scripts/docs/check_architecture.py

      - name: Check generated DB schema
        run: python scripts/docs/generate_db_schema.py --check

  frontend-build:
    name: frontend-build
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xuejian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xuejian/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  rust-test:
    name: rust-test
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: xuejian/src-tauri -> target

      - name: Run Rust tests
        working-directory: xuejian
        run: cargo test --manifest-path src-tauri/Cargo.toml

  python-orchestration-smoke:
    name: python-orchestration-smoke
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: xuejian/orchestration_service/requirements.txt

      - name: Install orchestration dependencies
        run: python -m pip install -r xuejian/orchestration_service/requirements.txt

      - name: Run orchestration smoke check
        run: python scripts/ci/python_orchestration_smoke.py

  evaluation-regression:
    name: evaluation-regression
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: xuejian/orchestration_service/requirements.txt

      - name: Install orchestration dependencies
        run: python -m pip install -r xuejian/orchestration_service/requirements.txt

      - name: Run eval unit tests (deterministic)
        shell: bash
        run: |
          mkdir -p xuejian/test-results/ci
          set -o pipefail
          pytest xuejian/tests/unit/test_eval_base.py \
                 xuejian/tests/unit/test_cardgraph_quality_eval.py \
                 xuejian/tests/unit/test_studygraph_recommendation_eval.py \
                 xuejian/tests/unit/test_supervisor_golden_tasks_eval.py \
                 xuejian/tests/unit/test_regression_report.py \
                 -v --tb=short \
                 2>&1 | tee xuejian/test-results/ci/eval-regression.log
          echo "${PIPESTATUS[0]}" > xuejian/test-results/ci/eval-regression.exit

      - name: Write eval regression summary
        run: |
          if [[ "$(cat xuejian/test-results/ci/eval-regression.exit)" == "0" ]]; then job_status=passed; else job_status=failed; fi
          node xuejian/scripts/ci/write-check-summary.mjs \
            --output xuejian/test-results/ci/eval-regression-summary.md \
            --name eval-regression \
            --status "$job_status" \
            --command "pytest eval unit tests" \
            --details "Blocking deterministic eval regression tests on PRs." \
            --stdout-file "xuejian/test-results/ci/eval-regression.log"

      - name: Upload eval regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-regression-results
          path: |
            xuejian/test-results/ci/eval-regression.log
            xuejian/test-results/ci/eval-regression-summary.md
            xuejian/test-results/ci/eval-regression.exit
          if-no-files-found: warn

  frontend-quality-baseline:
    name: frontend-quality-baseline
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: xuejian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xuejian/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint baseline
        shell: bash
        run: |
          mkdir -p test-results/ci
          set +e
          npm run lint > test-results/ci/lint.stdout.log 2> test-results/ci/lint.stderr.log
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then lint_status=passed; else lint_status=failed; fi
          node scripts/ci/write-check-summary.mjs \
            --output test-results/ci/lint-summary.md \
            --name lint \
            --status "$lint_status" \
            --command "npm run lint" \
            --details "Non-blocking frontend baseline check for PRs." \
            --stdout-file "test-results/ci/lint.stdout.log" \
            --stderr-file "test-results/ci/lint.stderr.log"
          echo "lint_status=$lint_status" >> "$GITHUB_ENV"

      - name: Run vitest baseline
        shell: bash
        run: |
          mkdir -p test-results/ci
          set +e
          npm run test -- --run --reporter=default --reporter=json --outputFile=test-results/ci/vitest-report.json > test-results/ci/vitest.stdout.log 2> test-results/ci/vitest.stderr.log
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then vitest_status=passed; else vitest_status=failed; fi
          node scripts/ci/write-check-summary.mjs \
            --output test-results/ci/vitest-summary.md \
            --name vitest \
            --status "$vitest_status" \
            --command "npm run test -- --run" \
            --details "Non-blocking frontend baseline check for PRs." \
            --artifact "test-results/ci/vitest-report.json" \
            --stdout-file "test-results/ci/vitest.stdout.log" \
            --stderr-file "test-results/ci/vitest.stderr.log"
          echo "vitest_status=$vitest_status" >> "$GITHUB_ENV"

      - name: Upload frontend baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-baseline
          path: |
            xuejian/test-results/ci/lint-summary.md
            xuejian/test-results/ci/lint.stdout.log
            xuejian/test-results/ci/lint.stderr.log
            xuejian/test-results/ci/vitest-summary.md
            xuejian/test-results/ci/vitest.stdout.log
            xuejian/test-results/ci/vitest.stderr.log
            xuejian/test-results/ci/vitest-report.json
          if-no-files-found: warn

      - name: Append baseline result to job summary
        if: always()
        shell: bash
        run: |
          {
            cat test-results/ci/lint-summary.md
            echo
            cat test-results/ci/vitest-summary.md
          } >> "$GITHUB_STEP_SUMMARY"
