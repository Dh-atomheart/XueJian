[package]
name = "app"
version = "0.1.0"
description = "学笺 - AI驱动的智能学习记忆应用"
authors = ["xuejian-team"]
license = "MIT"
repository = "https://github.com/yourusername/xuejian"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"

# Database
rusqlite = { version = "0.32", features = ["bundled", "functions", "chrono", "serde_json", "load_extension"] }
refinery = { version = "0.8", features = ["rusqlite"] }

# Security
tauri-plugin-stronghold = "2"
iota_stronghold = "2.1.0"

# File system
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Error handling
thiserror = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# HTTP Client (for AI API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
